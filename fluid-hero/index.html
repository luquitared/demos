<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Fluid — particle hero (Vercel-style copy)</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #060608; overflow: hidden; }
  body { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Inter, sans-serif; }

  #stage { position: fixed; inset: 0; }
  canvas { display: block; }

  /* foreground copy, sits above the canvas like the real page */
  .hero {
    position: fixed; inset: 0; display: grid; place-items: center;
    text-align: center; pointer-events: none; padding: 0 24px;
  }
  .hero .inner { max-width: 760px; }
  .badge {
    display: inline-flex; align-items: center; gap: 8px; margin-bottom: 28px;
    font-size: 14px; color: #b9bdc6;
  }
  .badge b {
    background: #1f6feb22; color: #6ea8fe; border: 1px solid #6ea8fe33;
    padding: 2px 9px; border-radius: 999px; font-weight: 600; font-size: 12px;
  }
  h1 {
    font-size: clamp(40px, 7vw, 84px); line-height: 0.98; letter-spacing: -0.03em;
    font-weight: 600; color: #fff;
    background: linear-gradient(#fff, #b8bcc6); -webkit-background-clip: text; background-clip: text;
  }
  p.sub { margin: 26px auto 34px; max-width: 540px; color: #9aa0ab; font-size: 19px; line-height: 1.5; }
  .cta { display: inline-flex; gap: 14px; pointer-events: auto; }
  .cta button {
    font: inherit; font-size: 15px; font-weight: 500; padding: 12px 22px; border-radius: 999px;
    cursor: pointer; border: 1px solid transparent; transition: transform .15s ease, background .15s ease;
  }
  .cta .primary { background: #fff; color: #000; }
  .cta .ghost { background: #0d0d10; color: #e8e8ea; border-color: #2a2a30; }
  .cta button:hover { transform: translateY(-1px); }
  .cta .ghost:hover { background: #16161b; }

  /* faint dotted frame + corner pluses, like the real hero */
  .frame { position: fixed; inset: 64px 12% ; border: 1px solid #ffffff10; pointer-events: none; }
  .frame::before, .frame::after,
  .plus { color: #ffffff44; }
  .plus { position: fixed; font-size: 22px; line-height: 0; pointer-events: none; }

  .hint { position: fixed; bottom: 18px; left: 0; right: 0; text-align: center; color: #5a5f69; font-size: 13px; pointer-events: none; }
</style>
</head>
<body>
  <div id="stage"></div>

  <div class="frame"></div>
  <div class="hero">
    <div class="inner">
      <div class="badge"><b>New</b> Lower Costs with Active CPU Pricing</div>
      <h1>The power of servers,<br/>in serverless form</h1>
      <p class="sub">Fluid compute combines the efficiency of servers and the flexibility of serverless, enabling real-time, dynamic workloads like APIs, streaming, and AI.</p>
      <div class="cta">
        <button class="primary">Enable Fluid</button>
        <button class="ghost">Get a demo</button>
      </div>
    </div>
  </div>
  <div class="hint">move your cursor through the dots &nbsp;·&nbsp; <a href="/" style="color:#7a808b;pointer-events:auto;">← demos</a></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.172.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.172.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { AfterimagePass } from 'three/addons/postprocessing/AfterimagePass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const stage = document.getElementById('stage');

// ---------- renderer ----------
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x000000, 0);
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();

// orthographic world: x in [-aspect, aspect], y in [-1, 1]
let aspect = innerWidth / innerHeight;
const camera = new THREE.OrthographicCamera(-aspect, aspect, 1, -1, 0.01, 10);
camera.position.z = 2;

// ---------- particle field ----------
// fill the view with a jittered grid of points; bias density toward the
// bottom + edges and away from the center (where the headline sits), so the
// resting cloud has the same organic "settled ink" shape as the real hero.
const COLS = 420, ROWS = 200;
const homes = [];
const rands = [];

function densityAt(nx, ny) {
  // nx in [-1,1] (scaled by aspect outside), ny in [-1,1] (1 = top, -1 = bottom)
  const t = (ny + 1) / 2;                       // 0 at bottom, 1 at top
  const bottom = Math.pow(1 - t, 1.7);          // strong bottom weighting
  const lower  = THREE.MathUtils.clamp((0.65 - t) / 0.65, 0, 1); // gate to lower ~2/3
  const edges  = Math.pow(Math.abs(nx), 2.2) * 0.6 * lower;       // creep up the L/R edges
  const center = 1.0 - 0.92 * Math.exp(-(nx * nx * 2.6 + (ny - 0.05) * (ny - 0.05) * 4.0)); // carve hole behind text
  return THREE.MathUtils.clamp(Math.max(bottom, edges) * center, 0, 1);
}

for (let i = 0; i < COLS; i++) {
  for (let j = 0; j < ROWS; j++) {
    const u = i / (COLS - 1), v = j / (ROWS - 1);
    const x = (u * 2 - 1) * aspect;
    const y = v * 2 - 1;
    const r = Math.random();
    if (r > densityAt(x / aspect, y) * 1.25) continue; // probabilistic mask
    const jx = (Math.random() - 0.5) * (2 * aspect / COLS) * 2.2;
    const jy = (Math.random() - 0.5) * (2 / ROWS) * 2.2;
    homes.push(x + jx, y + jy, (Math.random() - 0.5) * 0.05);
    rands.push(Math.random());
  }
}
const COUNT = rands.length;

const geo = new THREE.BufferGeometry();
geo.setAttribute('position', new THREE.Float32BufferAttribute(homes, 3));
geo.setAttribute('aHome',    new THREE.Float32BufferAttribute(homes.slice(), 3));
geo.setAttribute('aRand',    new THREE.Float32BufferAttribute(rands, 1));

const uniforms = {
  uTime:          { value: 0 },
  uPixelRatio:    { value: renderer.getPixelRatio() },
  uSize:          { value: 2.1 },
  uColor:         { value: new THREE.Color(0xc9ccd4) },
  uMouse:         { value: new THREE.Vector2(999, 999) },
  uMouseVel:      { value: new THREE.Vector2(0, 0) },
  uMouseRadius:   { value: 0.26 },
  uMouseStrength: { value: 0.34 },
  uFlowAmp:       { value: 0.11 },
};

const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexShader: /* glsl */`
    attribute vec3 aHome;
    attribute float aRand;
    uniform float uTime, uSize, uPixelRatio, uFlowAmp;
    uniform float uMouseRadius, uMouseStrength;
    uniform vec2 uMouse, uMouseVel;
    varying float vA;

    // --- Ashima simplex noise 3D (public domain) ---
    vec4 permute(vec4 x){ return mod(((x*34.0)+1.0)*x,289.0); }
    vec4 taylorInvSqrt(vec4 r){ return 1.79284291400159 - 0.85373472095314*r; }
    float snoise(vec3 v){
      const vec2 C = vec2(1.0/6.0, 1.0/3.0);
      const vec4 D = vec4(0.0,0.5,1.0,2.0);
      vec3 i  = floor(v + dot(v, C.yyy));
      vec3 x0 = v - i + dot(i, C.xxx);
      vec3 g = step(x0.yzx, x0.xyz);
      vec3 l = 1.0 - g;
      vec3 i1 = min(g.xyz, l.zxy);
      vec3 i2 = max(g.xyz, l.zxy);
      vec3 x1 = x0 - i1 + C.xxx;
      vec3 x2 = x0 - i2 + C.yyy;
      vec3 x3 = x0 - D.yyy;
      i = mod(i, 289.0);
      vec4 p = permute(permute(permute(
                i.z + vec4(0.0, i1.z, i2.z, 1.0))
              + i.y + vec4(0.0, i1.y, i2.y, 1.0))
              + i.x + vec4(0.0, i1.x, i2.x, 1.0));
      float n_ = 1.0/7.0;
      vec3 ns = n_ * D.wyz - D.xzx;
      vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
      vec4 x_ = floor(j * ns.z);
      vec4 y_ = floor(j - 7.0 * x_);
      vec4 x = x_ *ns.x + ns.yyyy;
      vec4 y = y_ *ns.x + ns.yyyy;
      vec4 h = 1.0 - abs(x) - abs(y);
      vec4 b0 = vec4(x.xy, y.xy);
      vec4 b1 = vec4(x.zw, y.zw);
      vec4 s0 = floor(b0)*2.0 + 1.0;
      vec4 s1 = floor(b1)*2.0 + 1.0;
      vec4 sh = -step(h, vec4(0.0));
      vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy;
      vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww;
      vec3 p0 = vec3(a0.xy, h.x);
      vec3 p1 = vec3(a0.zw, h.y);
      vec3 p2 = vec3(a1.xy, h.z);
      vec3 p3 = vec3(a1.zw, h.w);
      vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2,p2), dot(p3,p3)));
      p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
      vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
      m = m*m;
      return 42.0 * dot(m*m, vec4(dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3)));
    }
    // divergence-free-ish flow from the gradient of a scalar noise field
    vec2 flow(vec2 p, float t){
      float e = 0.08;
      float n1 = snoise(vec3(p + vec2(0.0, e), t));
      float n2 = snoise(vec3(p - vec2(0.0, e), t));
      float n3 = snoise(vec3(p + vec2(e, 0.0), t));
      float n4 = snoise(vec3(p - vec2(e, 0.0), t));
      return vec2(n1 - n2, -(n3 - n4)) / (2.0 * e);
    }

    void main(){
      vec3 pos = aHome;

      // organic ambient drift (curl-like flow field)
      vec2 f = flow(aHome.xy * 1.4 + vec2(0.0, uTime * 0.06), uTime * 0.05);
      pos.xy += f * uFlowAmp * (0.6 + aRand * 0.8);

      // mouse repulsion: carve a void + push along the cursor's motion (the wake)
      vec2 d = pos.xy - uMouse;
      float dist = length(d);
      float fall = exp(-(dist*dist) / (uMouseRadius*uMouseRadius));
      pos.xy += normalize(d + 1e-4) * fall * uMouseStrength;
      pos.xy += uMouseVel * fall * 1.6;          // drag particles in the direction of travel

      vec4 mv = modelViewMatrix * vec4(pos, 1.0);
      gl_Position = projectionMatrix * mv;

      float swell = 1.0 + fall * 1.4;            // pushed dots flare a touch brighter/bigger
      gl_PointSize = uSize * uPixelRatio * (0.45 + aRand * 0.9) * swell;
      vA = (0.18 + aRand * 0.32) * (0.7 + fall * 1.3);
    }
  `,
  fragmentShader: /* glsl */`
    precision highp float;
    uniform vec3 uColor;
    varying float vA;
    void main(){
      float d = length(gl_PointCoord - 0.5);
      float a = smoothstep(0.5, 0.06, d) * vA;
      if (a < 0.008) discard;
      gl_FragColor = vec4(uColor, a);
    }
  `,
});

const points = new THREE.Points(geo, mat);
scene.add(points);

// ---------- post-processing (afterimage trails + bloom) ----------
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));

const afterimage = new AfterimagePass();
afterimage.uniforms['damp'].value = 0.86;   // persistence → the smoky trail
composer.addPass(afterimage);

const bloom = new UnrealBloomPass(
  new THREE.Vector2(innerWidth, innerHeight),
  0.42,   // strength
  0.8,    // radius
  0.0     // threshold (dots are dim, so threshold ~0)
);
composer.addPass(bloom);
composer.addPass(new OutputPass());

// ---------- pointer ----------
const mouse = new THREE.Vector2(999, 999);
const target = new THREE.Vector2(999, 999);
let lastTarget = new THREE.Vector2(999, 999);
const vel = new THREE.Vector2(0, 0);

function toWorld(clientX, clientY) {
  const nx = (clientX / innerWidth) * 2 - 1;
  const ny = -((clientY / innerHeight) * 2 - 1);
  target.set(nx * aspect, ny);
}
addEventListener('pointermove', (e) => toWorld(e.clientX, e.clientY), { passive: true });
addEventListener('pointerleave', () => target.set(999, 999));

// ---------- loop ----------
const clock = new THREE.Clock();
function tick() {
  const t = clock.getElapsedTime();
  uniforms.uTime.value = t;

  // smooth the cursor; derive its velocity for the directional wake
  if (target.x < 900) {
    if (mouse.x > 900) mouse.copy(target);       // first contact, no jump
    vel.set(target.x - lastTarget.x, target.y - lastTarget.y);
    lastTarget.copy(target);
  } else {
    vel.multiplyScalar(0.9);
  }
  mouse.lerp(target, 0.18);
  uniforms.uMouse.value.copy(mouse);
  uniforms.uMouseVel.value.lerp(vel, 0.25);

  composer.render();
  requestAnimationFrame(tick);
}
tick();

// ---------- resize ----------
addEventListener('resize', () => {
  aspect = innerWidth / innerHeight;
  camera.left = -aspect; camera.right = aspect; camera.top = 1; camera.bottom = -1;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
  bloom.setSize(innerWidth, innerHeight);
  uniforms.uPixelRatio.value = renderer.getPixelRatio();
});
</script>
</body>
</html>
