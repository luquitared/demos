<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Fluid — cursor particle emitter (Vercel-style copy)</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #000; overflow: hidden; cursor: crosshair; }
  #stage { position: fixed; inset: 0; }
  canvas { display: block; }
  .back {
    position: fixed; bottom: 14px; left: 16px; z-index: 2;
    font: 12px ui-sans-serif, system-ui, sans-serif; color: #444; text-decoration: none;
  }
  .back:hover { color: #888; }
</style>
</head>
<body>
  <div id="stage"></div>
  <a class="back" href="/">← demos</a>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.172.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.172.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const stage = document.getElementById('stage');

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x000000, 1);
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();

// ortho world: x in [-aspect, aspect], y in [-1, 1] (y up)
let aspect = innerWidth / innerHeight;
const camera = new THREE.OrthographicCamera(-aspect, aspect, 1, -1, 0.01, 10);
camera.position.z = 2;

// ---------------------------------------------------------------------------
//  Particle pool — the cursor EMITS particles that then fall under gravity,
//  drift on a little curl noise, and fade out. Nothing is visible at rest.
// ---------------------------------------------------------------------------
const MAX = 9000;
const px = new Float32Array(MAX);   // position x
const py = new Float32Array(MAX);   // position y
const vx = new Float32Array(MAX);   // velocity x
const vy = new Float32Array(MAX);   // velocity y
const life = new Float32Array(MAX); // remaining life (s)
const ttl  = new Float32Array(MAX); // total life (s)
const seed = new Float32Array(MAX); // per-particle randomness
let head = 0;                       // ring-buffer write head
function spawn(x, y, ivx, ivy) {
  const i = head; head = (head + 1) % MAX;
  px[i] = x; py[i] = y;
  vx[i] = ivx; vy[i] = ivy;
  ttl[i] = 2.4 + Math.random() * 1.6;
  life[i] = ttl[i];
  seed[i] = Math.random();
}

// tuning — the "feel"
const GRAVITY     = 0.62;   // downward accel (world units / s^2). gentle.
const DRAG        = 0.86;   // velocity retained per second (air resistance)
const EMIT_STEP   = 0.0072; // world-space spacing between emitted dots along the path
const JITTER      = 0.016;  // perpendicular spread of the emitted ribbon
const INHERIT     = 0.10;   // how much cursor velocity the dots inherit
const SWAY        = 0.10;   // curl-noise turbulence amplitude
const MAX_SEG     = 0.45;   // ignore cursor teleports longer than this

// ---------------------------------------------------------------------------
//  Geometry / material — crisp soft round dots, additive, faint glow via bloom
// ---------------------------------------------------------------------------
const geo = new THREE.BufferGeometry();
const aPos = new Float32Array(MAX * 3);
const aAlpha = new Float32Array(MAX);
const aSize = new Float32Array(MAX);
geo.setAttribute('position', new THREE.BufferAttribute(aPos, 3));
geo.setAttribute('aAlpha', new THREE.BufferAttribute(aAlpha, 1));
geo.setAttribute('aSize',  new THREE.BufferAttribute(aSize, 1));

const mat = new THREE.ShaderMaterial({
  uniforms: {
    uPixelRatio: { value: renderer.getPixelRatio() },
    uColor:      { value: new THREE.Color(0xcdd1d9) },
  },
  transparent: true,
  depthWrite: false,
  depthTest: false,
  blending: THREE.AdditiveBlending,
  vertexShader: /* glsl */`
    attribute float aAlpha;
    attribute float aSize;
    uniform float uPixelRatio;
    varying float vA;
    void main(){
      vA = aAlpha;
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      gl_Position = projectionMatrix * mv;
      gl_PointSize = aSize * uPixelRatio;
    }
  `,
  fragmentShader: /* glsl */`
    precision highp float;
    uniform vec3 uColor;
    varying float vA;
    void main(){
      float d = length(gl_PointCoord - 0.5);
      float a = smoothstep(0.5, 0.04, d) * vA;
      if (a < 0.004) discard;
      gl_FragColor = vec4(uColor, a);
    }
  `,
});

const points = new THREE.Points(geo, mat);
points.frustumCulled = false;
scene.add(points);

// ---------------------------------------------------------------------------
//  Post: subtle bloom only (dots are crisp, not smoky)
// ---------------------------------------------------------------------------
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.45, 0.55, 0.0);
composer.addPass(bloom);
composer.addPass(new OutputPass());

// ---------------------------------------------------------------------------
//  cheap 2D value-noise for gentle horizontal sway as particles fall
// ---------------------------------------------------------------------------
function hash(x, y){ const s = Math.sin(x*127.1 + y*311.7) * 43758.5453; return s - Math.floor(s); }
function vnoise(x, y){
  const xi = Math.floor(x), yi = Math.floor(y);
  const xf = x - xi, yf = y - yi;
  const u = xf*xf*(3-2*xf), v = yf*yf*(3-2*yf);
  const a = hash(xi, yi),     b = hash(xi+1, yi);
  const c = hash(xi, yi+1),   d = hash(xi+1, yi+1);
  return (a*(1-u)+b*u)*(1-v) + (c*(1-u)+d*u)*v - 0.5;
}

// ---------------------------------------------------------------------------
//  pointer → emission along the path (arc-length sampling for even spacing)
// ---------------------------------------------------------------------------
const cursor = new THREE.Vector2(0, 0);
let haveCursor = false, prevCursor = new THREE.Vector2(0, 0);
let cvx = 0, cvy = 0;            // cursor velocity (world / s)
let carry = 0;                  // leftover arc-length between frames
let userActive = false, lastInputT = -10;

function toWorld(clientX, clientY, out){
  const nx = (clientX / innerWidth) * 2 - 1;
  const ny = -((clientY / innerHeight) * 2 - 1);
  out.set(nx * aspect, ny);
}
addEventListener('pointermove', (e) => {
  toWorld(e.clientX, e.clientY, cursor);
  if (!haveCursor){ prevCursor.copy(cursor); haveCursor = true; }
  userActive = true; lastInputT = performance.now() / 1000;
}, { passive: true });

// idle "attract" path so the canvas is alive before the user moves the mouse
const idle = new THREE.Vector2(0, 0);
function idlePath(t){
  const x = Math.sin(t * 0.55) * aspect * 0.72;
  const y = Math.sin(t * 0.9 + 1.3) * 0.45 + 0.15;
  idle.set(x, y);
}

function emitAlong(ax, ay, bx, by, ivx, ivy){
  const dx = bx - ax, dy = by - ay;
  const segLen = Math.hypot(dx, dy);
  if (segLen > MAX_SEG) return;            // teleport / first frame — skip
  let dist = carry;
  const nx = segLen > 1e-6 ? dx / segLen : 0;
  const ny = segLen > 1e-6 ? dy / segLen : 0;
  const perpx = -ny, perpy = nx;
  while (dist <= segLen){
    const t = dist / Math.max(segLen, 1e-6);
    const j = (Math.random() - 0.5) * JITTER;
    const ox = ax + dx * t + perpx * j;
    const oy = ay + dy * t + perpy * j;
    spawn(
      ox, oy,
      ivx * INHERIT + (Math.random() - 0.5) * 0.05,
      ivy * INHERIT + (Math.random() - 0.5) * 0.05
    );
    dist += EMIT_STEP;
  }
  carry = dist - segLen;
}

// ---------------------------------------------------------------------------
//  simulate one step + build the draw buffers
// ---------------------------------------------------------------------------
function simulate(dt, now){
  const dragF = Math.pow(DRAG, dt);
  let n = 0;
  for (let i = 0; i < MAX; i++){
    if (life[i] <= 0) continue;
    life[i] -= dt;
    if (life[i] <= 0) continue;

    // forces: gravity + gentle curl-ish sway
    const sway = vnoise(px[i] * 1.6 + now * 0.15, py[i] * 1.6) * SWAY;
    vx[i] += sway * dt;
    vy[i] -= GRAVITY * dt;
    vx[i] *= dragF; vy[i] *= dragF;
    px[i] += vx[i] * dt;
    py[i] += vy[i] * dt;

    // fade: quick in, long out
    const k = life[i] / ttl[i];                 // 1 -> 0 over lifetime
    const fadeIn = THREE.MathUtils.smoothstep(1 - k, 0.0, 0.06);
    const fadeOut = THREE.MathUtils.smoothstep(k, 0.0, 0.5);
    const alpha = fadeIn * fadeOut;

    aPos[n*3] = px[i]; aPos[n*3+1] = py[i]; aPos[n*3+2] = 0;
    aAlpha[n] = alpha * (0.62 + seed[i] * 0.38);
    aSize[n]  = 1.6 + seed[i] * 2.0;
    n++;
  }
  geo.setDrawRange(0, n);
  geo.attributes.position.needsUpdate = true;
  geo.attributes.aAlpha.needsUpdate = true;
  geo.attributes.aSize.needsUpdate = true;
  return n;
}
function draw(){ composer.render(); }

// ---------------------------------------------------------------------------
//  main loop
// ---------------------------------------------------------------------------
const clock = new THREE.Clock();
function tick(){
  let dt = clock.getDelta();
  dt = Math.min(dt, 1 / 30);               // clamp to avoid blowups on tab refocus
  const now = clock.elapsedTime;

  // choose emitter source: real cursor while active, else the idle path
  if (userActive && (performance.now()/1000 - lastInputT) > 3.5) userActive = false;

  if (userActive && haveCursor){
    const sx = cursor.x, sy = cursor.y;
    cvx = (sx - prevCursor.x) / dt;
    cvy = (sy - prevCursor.y) / dt;
    emitAlong(prevCursor.x, prevCursor.y, sx, sy, cvx, cvy);
    prevCursor.set(sx, sy);
  } else {
    const a = idle.clone();
    idlePath(now);
    const ivx = (idle.x - a.x) / dt, ivy = (idle.y - a.y) / dt;
    emitAlong(a.x, a.y, idle.x, idle.y, ivx, ivy);
  }

  simulate(dt, now);
  draw();
  requestAnimationFrame(tick);
}
tick();

// test hook: synchronously run a cursor sweep over many frames, then render.
// lets the falling-trail behaviour be inspected even in a throttled tab.
window.__test = function(frames = 220, dt = 1/60){
  let prev = { x: -aspect * 0.8, y: 0.45 };
  let last = 0;
  for (let f = 0; f < frames; f++){
    const t = f / frames;
    // a horizontal sweep with a little vertical wiggle
    const cur = { x: -aspect * 0.8 + t * aspect * 1.6, y: 0.45 + Math.sin(t * 7) * 0.08 };
    emitAlong(prev.x, prev.y, cur.x, cur.y, (cur.x - prev.x) / dt, (cur.y - prev.y) / dt);
    prev = cur;
    last = simulate(dt, f * dt);
  }
  draw();
  return last;
};
// hold the "cursor" roughly still → particles should fall straight down as a curtain
window.__hold = function(frames = 200, dt = 1/60){
  let prev = { x: 0.1, y: 0.55 }, last = 0;
  for (let f = 0; f < frames; f++){
    const cur = { x: 0.1 + Math.sin(f * 0.3) * 0.03, y: 0.55 };
    emitAlong(prev.x, prev.y, cur.x, cur.y, 0, 0);
    prev = cur;
    last = simulate(dt, f * dt);
  }
  draw();
  return last;
};

addEventListener('resize', () => {
  aspect = innerWidth / innerHeight;
  camera.left = -aspect; camera.right = aspect; camera.top = 1; camera.bottom = -1;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
  bloom.setSize(innerWidth, innerHeight);
  mat.uniforms.uPixelRatio.value = renderer.getPixelRatio();
});
</script>
</body>
</html>
