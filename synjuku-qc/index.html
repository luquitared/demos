<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Annotation Review · spans + grounded summary</title>
<style>
:root{--seal:#B64D3D;--ink:#2D2D2B;--muted:rgba(45,45,43,.55);--faint:rgba(45,45,43,.12);
  --rice:#F1F2EC;--panel:#FBFBF8;--tint:#E8E9E2;--green:#6F8C5A;--green-bg:#EEF3E9;--gold:#B98A2E;--gold-bg:#F6EFDD;}
*{box-sizing:border-box}
body{margin:0;font-family:'Inter',-apple-system,system-ui,sans-serif;background:var(--rice);color:var(--ink);font-size:14px;line-height:1.5;height:100vh;overflow:hidden;display:flex;flex-direction:column}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
header{display:flex;align-items:center;gap:18px;padding:10px 18px;background:var(--panel);border-bottom:1px solid var(--faint)}
header h1{font-size:15px;font-weight:600;margin:0}header h1 .tag{color:var(--seal)}
.spacer{flex:1}.hint{font-size:11px;color:var(--muted)}
.main{flex:1;display:flex;min-height:0}
.list{width:210px;border-right:1px solid var(--faint);overflow-y:auto;background:var(--panel);flex:none}
.erow{padding:9px 13px;border-bottom:1px solid var(--faint);cursor:pointer}
.erow:hover{background:var(--tint)}.erow.sel{background:var(--rice);box-shadow:inset 3px 0 0 var(--seal)}
.erow .t{font-size:12px;font-weight:600}.erow .e{font-size:11px;color:var(--muted)}
.detail{flex:1;overflow-y:auto;padding:18px 24px}
.crumbs{font-size:12px;color:var(--muted);margin-bottom:12px}
.grid{display:grid;grid-template-columns:minmax(440px,1.3fr) 1fr;gap:22px;align-items:start}
video{width:100%;border-radius:8px;background:#000;display:block}
.tl{display:flex;height:18px;margin-top:6px;border-radius:4px;overflow:hidden;border:1px solid var(--faint);background:var(--tint)}
.tl .seg{height:100%;border-right:1px solid rgba(255,255,255,.5);cursor:pointer;background:#cfd3c3}
.tl .seg.fl{background:#E2B377}
.tl .seg:hover{background:var(--gold)}.tl .seg.on{background:var(--seal)}
.card{border:1px solid var(--faint);border-radius:8px;padding:15px 17px;background:var(--panel)}
.card .kick{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.card h2{font-size:19px;margin:4px 0 2px}.card .env{display:inline-block;font-size:12px;background:var(--tint);border-radius:5px;padding:2px 8px;font-weight:600;margin-bottom:8px}
.card .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-top:11px;font-weight:600}
.objs{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}.obj{font-size:12px;background:var(--green-bg);color:var(--green);border-radius:5px;padding:2px 8px}
.steps{font-size:12px;margin:5px 0 0;padding-left:1.1em}.steps li{margin:1px 0}
.sums{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:20px 0 6px}
.sum{border:1px solid var(--faint);border-radius:8px;padding:13px 15px;background:var(--panel)}
.sum.g{border-color:var(--green);background:var(--green-bg)}
.sum .h{font-size:11px;text-transform:uppercase;letter-spacing:.05em;font-weight:700;margin-bottom:6px;color:var(--muted)}
.sum.g .h{color:var(--green)}.sum .h .badge{float:right;font-weight:600;text-transform:none;letter-spacing:0}
.sum p{margin:0;font-size:13.5px;line-height:1.55}
.spanwrap{margin-top:18px}
.spanwrap .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;margin-bottom:6px}
.spans{max-height:280px;overflow-y:auto;border:1px solid var(--faint);border-radius:8px;background:var(--panel)}
.sp{display:flex;gap:10px;padding:6px 12px;border-bottom:1px solid var(--faint);cursor:pointer;font-size:13px}
.sp:hover{background:var(--tint)}.sp.on{background:var(--gold-bg);box-shadow:inset 3px 0 0 var(--gold)}
.sp .ts{color:var(--muted);flex:none;width:86px}.sp .lab{flex:1}
.sp.flag-occ{box-shadow:inset 3px 0 0 var(--seal)}.sp.flag-rig{box-shadow:inset 3px 0 0 var(--gold)}.sp.flag-rep{box-shadow:inset 3px 0 0 #7E86A8}
.chips{display:flex;gap:4px;flex:none;align-items:center}
.chip{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;border-radius:4px;padding:1px 5px}
.chip.occ{background:var(--seal);color:#fff}.chip.rig{background:var(--gold);color:#fff}.chip.rep{background:#7E86A8;color:#fff}
.ebadge{display:inline-block;font-size:10px;font-weight:700;background:var(--seal);color:#fff;border-radius:9px;padding:0 6px;margin-left:5px}
.issbar{display:flex;gap:14px;align-items:center;font-size:12px;margin:14px 0 4px;padding:8px 12px;background:var(--gold-bg);border:1px solid var(--faint);border-radius:7px}
.issbar b{font-weight:700}.issbar .none{color:var(--green)}
.iss{display:inline-flex;align-items:center;gap:5px}.iss .sw{width:10px;height:10px;border-radius:3px;display:inline-block}
.sw.occ{background:var(--seal)}.sw.rig{background:var(--gold)}.sw.rep{background:#7E86A8}
.ftoggle{font-size:11px;border:1px solid var(--faint);background:var(--panel);border-radius:6px;padding:4px 9px;cursor:pointer}
.ftoggle.on{background:var(--seal);color:#fff;border-color:var(--seal)}
.empty{color:var(--muted);padding:50px;text-align:center}
</style></head>
<body><a href="/" style="position:fixed;bottom:10px;left:10px;z-index:999;font:12px sans-serif;color:#888;text-decoration:none;background:rgba(255,255,255,.8);padding:3px 9px;border-radius:6px;border:1px solid #ddd">← demos</a>
<header>
  <h1>Annotation <span class="tag">Review</span></h1>
  <div class="hint" id="meta"></div>
  <div class="spacer"></div>
  <div class="hint">click a span or timeline block to seek · spans highlight as it plays</div>
</header>
<div class="main">
  <div class="list" id="list"></div>
  <div class="detail" id="detail"><div class="empty">loading…</div></div>
</div>
<script>
let EP=[],cur=0,vid=null,flaggedOnly=false;
// --- heuristic issue detectors (transparent, tweak the regexes freely) ---
const RX={
  occ:/camera|lens|blocking view|causing darkness|cover(?:ing)?[^.]*\b(view|lens)\b/i,
  rig:/tripod|spotlight|power strip|light stand|lamp stand|attach light to stand|light on the stand|on the stand|stand near floor|on tripod/i,
};
function toks(s){return new Set(s.toLowerCase().replace(/[^a-z ]/g,'').split(/\s+/).filter(w=>w.length>3));}
function jac(a,b){const A=toks(a),B=toks(b);let i=0;A.forEach(x=>{if(B.has(x))i++;});return i/((A.size+B.size-i)||1);}
function spanFlags(e){
  const norm=e.spans.map(s=>s.label.toLowerCase().trim());
  const cnt={}; norm.forEach(n=>cnt[n]=(cnt[n]||0)+1);
  return e.spans.map((s,j)=>{
    const f=[];
    if(RX.occ.test(s.label))f.push("occ");
    if(RX.rig.test(s.label))f.push("rig");
    const dup=cnt[norm[j]]>=2;
    const near=(j>0&&jac(s.label,e.spans[j-1].label)>0.7)||(j<e.spans.length-1&&jac(s.label,e.spans[j+1].label)>0.7);
    if(dup||near)f.push("rep");
    return f;
  });
}
function epCounts(e){
  const F=spanFlags(e),c={occ:0,rig:0,rep:0,any:0};
  F.forEach(f=>{if(f.length)c.any++;f.forEach(k=>c[k]++);});
  return c;
}
const CHIP={occ:"occlusion",rig:"rig",rep:"repeat"};
async function boot(){
  try{ EP=(await (await fetch("out_review/review_data.json",{cache:"no-store"})).json()).episodes; }
  catch(e){ document.getElementById("detail").innerHTML='<div class="empty">Run <code>python build_review.py</code> first.</div>'; return; }
  const tot=EP.reduce((a,e)=>a+epCounts(e).any,0);
  document.getElementById("meta").innerHTML=`${EP.length} episodes · <b>${tot}</b> spans flagged`;
  renderList(); select(0);
}
function renderList(){
  document.getElementById("list").innerHTML=EP.map((e,i)=>{
    const n=epCounts(e).any;
    return `<div class="erow ${i===cur?'sel':''}" data-i="${i}"><div class="t mono">${e.task_id} · ${e.card.environment}${n?`<span class="ebadge">⚑${n}</span>`:''}</div><div class="e">${e.spans.length} spans</div></div>`;
  }).join("");
  document.querySelectorAll(".erow").forEach(r=>r.onclick=()=>select(+r.dataset.i));
}
function fmt(s){const m=Math.floor(s/60),x=Math.floor(s%60);return `${m}:${String(x).padStart(2,'0')}`;}
function select(i){
  cur=i; const e=EP[i],c=e.card; renderList();
  const F=spanFlags(e), cc=epCounts(e);
  const iss=cc.any?`<div class="iss"><span class="sw occ"></span>occlusion <b>${cc.occ}</b></div>
      <div class="iss"><span class="sw rig"></span>rig <b>${cc.rig}</b></div>
      <div class="iss"><span class="sw rep"></span>repeat <b>${cc.rep}</b></div>
      <div style="flex:1"></div><button class="ftoggle ${flaggedOnly?'on':''}" onclick="toggleFilter()">⚑ flagged only</button>`
    :`<span class="none">no spans flagged in this episode</span>`;
  const rows=e.spans.map((s,j)=>{
    const f=F[j]; if(flaggedOnly&&!f.length)return "";
    const cls=f.length?("flag-"+(f[0]==="occ"?"occ":f[0]==="rig"?"rig":"rep")):"";
    const chips=f.map(k=>`<span class="chip ${k}">${CHIP[k]}</span>`).join("");
    return `<div class="sp ${cls}" data-j="${j}" data-start="${s.start}"><span class="ts mono">${fmt(s.start)}–${fmt(s.end)}</span><span class="lab">${s.label}</span><span class="chips">${chips}</span></div>`;
  }).join("");
  document.getElementById("detail").innerHTML=`
    <div class="crumbs mono">task ${e.task_id} · episode ${e.episode_id} · ${e.spans.length} spans · 4-min clip</div>
    <div class="grid">
      <div>
        <video id="vid" src="${e.clip}" controls preload="metadata"></video>
        <div class="tl" id="tl">${e.spans.map((s,j)=>`<div class="seg ${F[j].length?'fl':''}" data-j="${j}" style="flex:${(s.end-s.start).toFixed(2)}" title="${s.label}${F[j].length?' ['+F[j].map(k=>CHIP[k]).join(', ')+']':''}"></div>`).join("")}</div>
      </div>
      <div class="card">
        <div class="kick">resolved card · task ${e.task_id}</div>
        <h2>${c.name}</h2><div><span class="env">${c.environment}</span></div>
        <div class="lbl">required objects</div><div class="objs">${(c.required_objects||[]).map(o=>`<span class="obj">${o}</span>`).join("")}</div>
        ${c.steps&&c.steps.length?`<div class="lbl">steps</div><ol class="steps">${c.steps.map(s=>`<li>${s}</li>`).join("")}</ol>`:""}
      </div>
    </div>
    <div class="sums">
      <div class="sum"><div class="h">Ungrounded <span class="badge">spans only</span></div><p>${e.summary_ungrounded||"—"}</p></div>
      <div class="sum g"><div class="h">Grounded <span class="badge">+ card</span></div><p>${e.summary_grounded||"—"}</p></div>
    </div>
    <div class="issbar">${iss}</div>
    <div class="spanwrap">
      <div class="lbl">generated spans (real VLM output) — click to seek · colored bar = flagged</div>
      <div class="spans" id="spans">${rows||'<div class="empty">no flagged spans</div>'}</div>
    </div>`;
  vid=document.getElementById("vid");
  document.querySelectorAll(".sp").forEach(el=>el.onclick=()=>{vid.currentTime=+el.dataset.start;vid.play();});
  document.querySelectorAll(".tl .seg").forEach(el=>el.onclick=()=>{vid.currentTime=e.spans[+el.dataset.j].start;vid.play();});
  vid.ontimeupdate=()=>highlight(e,vid.currentTime);
}
function toggleFilter(){flaggedOnly=!flaggedOnly;select(cur);}
function highlight(e,t){
  let idx=e.spans.findIndex(s=>t>=s.start&&t<s.end);
  document.querySelectorAll(".sp").forEach(el=>el.classList.toggle("on",+el.dataset.j===idx));
  document.querySelectorAll(".tl .seg").forEach((el,j)=>el.classList.toggle("on",j===idx));
  const on=document.querySelector(".sp.on"); if(on)on.scrollIntoView({block:"nearest"});
}
function highlight(e,t){
  let idx=e.spans.findIndex(s=>t>=s.start&&t<s.end);
  document.querySelectorAll(".sp").forEach((el,j)=>el.classList.toggle("on",j===idx));
  document.querySelectorAll(".tl .seg").forEach((el,j)=>el.classList.toggle("on",j===idx));
  const on=document.querySelector(".sp.on"); if(on)on.scrollIntoView({block:"nearest"});
}
document.addEventListener("keydown",e=>{
  if(e.key==="ArrowDown"||e.key==="j"){e.preventDefault();select(Math.min(cur+1,EP.length-1));}
  else if(e.key==="ArrowUp"||e.key==="k"){e.preventDefault();select(Math.max(cur-1,0));}
});
boot();
</script></body></html>
